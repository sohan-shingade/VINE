# Time-to-event (survival) evaluation of the irrigation clock (D2).
# The event is a drawdown below the decision-time level; windows cut short by
# gaps or the record end are right-censored and scored with IPCW weights.
drawdown: 0.3
max_h: 48
n_folds: 5
sigma_halflife_h: 72.0
mu_halflife_h: 336.0
min_pairs: 24
n_drift_buckets: 24
report_horizons: [6, 12, 24, 48]
quantiles: [0.1, 0.5, 0.9]
