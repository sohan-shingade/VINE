site_name: VINE Wiki
site_description: AI/ML models for agricultural analytics on the National Research Platform (GSoC 2026)
docs_dir: docs
repo_url: https://gitlab.nrp-nautilus.io/
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: green
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc: { permalink: true }

nav:
  - Home: index.md
  - Current state & progress: STATE.md
  - Architecture: architecture.md
  - Infrastructure (NRP & NDP): infrastructure.md
  - Guides:
      - Getting started: guides/getting-started.md
      - Contributing: guides/contributing.md
      - Working with Claude Code: guides/claude-code.md
  - Data:
      - Datasheet: data/index.md
  - Models:
      - Overview: models/index.md
      - D2 persistence: models/irrigation/persistence.md
      - D3 stress screening: models/plant-health/stress-screening.md
      - D3 CNN on pseudo-labels (pipeline validation): models/plant-health/cnn-pseudolabel.md
      - D4 GDD exploration (not a model): models/harvest/gdd-exploration.md
      - Template: models/_template.md
  - Decisions (ADRs):
      - Index: adr/index.md
      - 0000 Template: adr/0000-template.md
      - 0001 Monorepo layout: adr/0001-monorepo-src-layout.md
      - 0002 uv: adr/0002-uv-package-manager.md
      - 0003 Three-track priority: adr/0003-track-priority.md
      - 0004 Config management: adr/0004-config-management.md
      - 0005 Experiment tracking: adr/0005-experiment-tracking.md
      - 0006 NDP data access: adr/0006-ndp-data-access.md
      - 0007 NRP infrastructure: adr/0007-nrp-infrastructure.md
      - 0008 Sensor source (InfluxDB): adr/0008-sensor-source-influxdb.md
      - 0009 Weather data sources: adr/0009-weather-data-sources.md
      - 0010 Economic value for alerts: adr/0010-economic-value-for-alert-rules.md
      - 0011 Skill ceiling evaluation: adr/0011-skill-ceiling-evaluation.md
      - 0012 Censoring-aware time-to-event: adr/0012-censoring-aware-time-to-event.md
  - Devlog:
      - Overview: devlog/index.md
      - 2026-07-23 — D2, D3 & serving: devlog/2026-07-23-d2-d3-serving.md
      - 2026-08-05 — Final push: devlog/2026-08-05-final-push.md
      - "2026-08-05: June in review": devlog/2026-08-05-june-in-review.md
      - "2026-08-05: The decision layer": devlog/2026-08-05-decision-layer.md
      - "2026-08-05: The skill ceiling": devlog/2026-08-05-skill-ceiling.md
      - "2026-08-05: The irrigation clock": devlog/2026-08-05-survival-clock.md
  - Reports:
      - Reproducible final evaluation (2026-08-05): reports/2026-08-05-final-evaluation.md
      - D4 GDD phenology exploration (2026-08-04): reports/2026-08-04-d4-gdd-exploration.md
      - D2 vintage validation (2026-08-04): reports/2026-08-04-d2-vintage-validation.md
      - D3 offline screening (2026-08-05): reports/2026-08-05-d3-screening.md
      - D2 inferred irrigation events (2026-08-05): reports/2026-08-05-inferred-irrigation-events.md
      - D2 first-passage alert probabilities (2026-08-05): reports/2026-08-05-first-passage-alerts.md
      - D2 event-conditioned evaluation (2026-08-05): reports/2026-08-05-event-study.md
