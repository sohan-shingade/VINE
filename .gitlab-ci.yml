# GitLab CI for gitlab.nrp-nautilus.io. Mirrors the `make check` gate.
# Heavy GPU training does NOT run here — it runs interactively on NRP GPU pods.
stages: [lint, test, build]

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

default:
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [".uv-cache"]
  before_script:
    - uv sync --extra dev --extra geo --extra serve

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy

test:
  stage: test
  script:
    - uv run pytest -m "not slow and not gpu" --cov=vine --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'

notebooks:
  stage: test
  timeout: 45m
  before_script:
    - uv sync --extra dev --extra notebooks --extra geo --extra sensors
    - uvx --from 'dvc[s3]' dvc pull data/raw/sensors.dvc data/raw/weather.dvc data/raw/imagery.dvc
    - test -n "$(find data/raw/sensors -maxdepth 1 -name '*.parquet' -print -quit)"
    - test -n "$(find data/raw/weather -maxdepth 1 -name '*.parquet' -print -quit)"
    - test -s data/raw/imagery/inventory.parquet
  script:
    - uv run python scripts/check_notebooks.py --check-only
    - uv run python scripts/check_notebooks.py --timeout 600

# Build the complete irrigation image on branches/MRs, and publish it only from
# a protected immutable Git tag. CV and harvest images stay out of CI until their
# inference entrypoints are complete.
build-images:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        PUSH_IMAGE: "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
      variables:
        PUSH_IMAGE: "false"
  before_script: []
  script:
    - IMAGE_REPOSITORY="$CI_REGISTRY_IMAGE/irrigation"
    - IMAGE_TAG="$CI_COMMIT_SHA"
    - docker build --pull -f docker/d2_irrigation.Dockerfile -t "$IMAGE_REPOSITORY:$IMAGE_TAG" .
    - |
      if [ "$PUSH_IMAGE" = "true" ]; then
        test -n "$CI_REGISTRY_USER"
        test -n "$CI_REGISTRY_PASSWORD"
        printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
      else
        echo "Built $IMAGE_REPOSITORY:$IMAGE_TAG without publishing"
      fi
